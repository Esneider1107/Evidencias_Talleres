upstream users_backend {
    server users1:5000;
    server users2:5000;
}

upstream orders_backend {
    server orders1:5000;
    server orders2:5000;
}

server {
    listen 80;

    location /api/users/ {
        proxy_pass http://users_backend/;
    }

    location /api/products/ {
        proxy_pass http://products:5000/;
    }

    location /api/orders/ {
        proxy_pass http://orders_backend/;
    }
}